[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "auto-shark"
version = "0.1.1"
description = "Offline-first, evidence-preserving CTF packet analysis workbench"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Auto-Shark contributors" }]
keywords = ["ctf", "pcap", "tshark", "forensics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7; python_version >= '3.11'"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
auto-shark = "auto_shark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_shark"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  # PEP 604 union syntax is unavailable on the supported Python 3.9 runtime.
  "UP045",
]
