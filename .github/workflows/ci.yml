name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
            tshark_path: /usr/bin/tshark
          - os: windows-latest
            python: "3.11"
            tshark_path: C:\Program Files\Wireshark\tshark.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install TShark (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tshark
      - name: Install TShark (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install -y --no-progress wireshark
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - name: Run tests with real TShark
        env:
          AUTO_SHARK_TSHARK: ${{ matrix.tshark_path }}
        shell: bash
        run: |
          set +e
          uv run pytest --cov=auto_shark --cov-report=term-missing > pytest-output.txt 2>&1
          status=$?
          grep -E "^(FAILED|ERROR) " pytest-output.txt | while read -r line; do
            echo "::error::${line}"
          done
          tail -n 60 pytest-output.txt
          exit $status
      - name: CLI smoke analyze on committed fixture
        if: runner.os == 'Windows'
        shell: bash
        env:
          AUTO_SHARK_TSHARK: ${{ matrix.tshark_path }}
        run: |
          uv run auto-shark analyze tests/fixtures/http-smoke.pcap \
            --project "$RUNNER_TEMP/smoke.auto-shark" \
            --with-bodies --scan
          uv run auto-shark report "$RUNNER_TEMP/smoke.auto-shark" > /dev/null
